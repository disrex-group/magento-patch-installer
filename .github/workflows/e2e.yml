name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store:
    name: ${{ matrix.dist }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dist: Magento, version: 2.4.6-p15, php: '8.2', vendor: magento, repo: 'https://mirror.mage-os.org/' }
          - { dist: Magento, version: 2.4.7-p10, php: '8.3', vendor: magento, repo: 'https://mirror.mage-os.org/' }
          - { dist: Magento, version: 2.4.8-p5, php: '8.4', vendor: magento, repo: 'https://mirror.mage-os.org/' }
          - { dist: Magento, version: 2.4.9, php: '8.4', vendor: magento, repo: 'https://mirror.mage-os.org/' }
          - { dist: Mage-OS, version: 1.3.1, php: '8.3', vendor: mage-os, repo: 'https://repo.mage-os.org/' }
          - { dist: Mage-OS, version: 2.3.0, php: '8.3', vendor: mage-os, repo: 'https://repo.mage-os.org/' }
          - { dist: Mage-OS, version: 3.6.0, php: '8.4', vendor: mage-os, repo: 'https://repo.mage-os.org/' }
    env:
      SHOP: ${{ github.workspace }}/../shop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # The Mage-OS mirror serves Adobe's own magento/* packages without repo.magento.com keys.
      - name: Install ${{ matrix.dist }} ${{ matrix.version }}
        run: |
          composer create-project --no-install --no-interaction --repository-url=${{ matrix.repo }} "${{ matrix.vendor }}/project-community-edition=${{ matrix.version }}" "$SHOP"
          cd "$SHOP"
          composer config --no-plugins repositories.0 composer ${{ matrix.repo }}
          composer config --no-plugins --unset allow-plugins
          composer config --no-plugins allow-plugins.${{ matrix.vendor }}/composer-dependency-version-audit-plugin false
          composer config --no-plugins allow-plugins.'*' true
          composer install --no-dev --no-interaction --no-progress --ignore-platform-reqs --no-security-blocking
      - name: Build a patch package from the installed files
        run: php tests/e2e-fixture.php "$SHOP" "${{ runner.temp }}/fixture"
      - name: Patch, verify, revert and heal
        env:
          PATCHES_DIR: ${{ runner.temp }}/fixture
          PATCHES_PACKAGE: disrex/e2e-fixture-patches
          PATCHES_VERSION: 1.0.0
          E2E_WORK: ${{ runner.temp }}/work
          E2E_COMPOSER_FLAGS: --ignore-platform-reqs --no-security-blocking
        run: tests/e2e-local.sh "$SHOP"
